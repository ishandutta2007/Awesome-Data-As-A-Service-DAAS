<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="pillGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0ea5e9" stop-opacity=".25"/><stop offset="100%" stop-color="#6366f1" stop-opacity=".25"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity=".3"/></pattern></defs><style>@keyframes pulseOrb{0%{transform:scale(1);opacity:.35}50%{transform:scale(1.18);opacity:.6}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.3}50%{transform:translateY(-14px) translateX(10px);opacity:.8}}@keyframes streamData{0%{stroke-dashoffset:120}}@keyframes rotateRing{0%{transform:rotate(0deg)}}.orb-left{transform-origin:180px 140px;animation:pulseOrb 8s ease-in-out infinite}.orb-right{transform-origin:1040px 260px;animation:pulseOrb 7s ease-in-out infinite 1.5s}.particle-1{animation:floatParticle 5s ease-in-out infinite}.particle-2{animation:floatParticle 6s ease-in-out infinite 1s}.particle-3{animation:floatParticle 7s ease-in-out infinite 2s}.data-flow{stroke-dasharray:8 16;animation:streamData 3s linear infinite}.rotating-ring{transform-origin:1060px 100px;animation:rotateRing 20s linear infinite}.main-title{font-weight:800;font-size:54px;letter-spacing:-.02em}.main-title,.pill-text,.subtitle{font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.subtitle{font-weight:400;font-size:21px;letter-spacing:-.01em}.pill-text{font-weight:600;font-size:13px;letter-spacing:.04em}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="20"/><rect width="1200" height="420" fill="url(#grid)" rx="20"/><circle cx="180" cy="140" r="160" fill="#38bdf8" class="orb-left" filter="url(#glow)"/><circle cx="1040" cy="260" r="190" fill="#818cf8" class="orb-right" filter="url(#glow)"/><circle cx="600" cy="210" r="120" fill="#c084fc" filter="url(#glow)" opacity=".12"/><g class="rotating-ring" opacity=".25"><circle cx="1060" cy="100" r="65" fill="none" stroke="#38bdf8" stroke-dasharray="6 12" stroke-width="1.5"/><circle cx="1060" cy="100" r="80" fill="none" stroke="#818cf8" stroke-dasharray="4 8" stroke-width="1"/></g><g opacity=".45"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 80 340 Q 320 370 560 330 T 1120 350" class="data-flow"/><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M 100 80 Q 400 30 700 70 T 1100 60" class="data-flow"/><circle cx="240" cy="345" r="4" fill="#38bdf8" class="particle-1"/><circle cx="720" cy="335" r="3.5" fill="#c084fc" class="particle-2"/><circle cx="980" cy="348" r="5" fill="#818cf8" class="particle-3"/></g><g transform="translate(600, 75)"><rect width="280" height="36" x="-140" y="-18" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="18"/><circle cx="-114" cy="0" r="4.5" fill="#38bdf8"/><text x="-98" y="4.5" fill="#38bdf8" class="pill-text">CURATED AWESOME DIRECTORY</text></g><g><text fill="url(#primaryGrad)" class="main-title" filter="url(#subtleGlow)" text-anchor="middle" transform="translate(600, 155)">Data-As-A-Service (DaaS)</text></g><g><text fill="#94a3b8" class="subtitle" text-anchor="middle" transform="translate(600, 205)">Top Commercial Marketplaces, Data Enrichment APIs &amp; Open-Source Infrastructure</text></g><g><g transform="translate(600, 290) translate(-360, 0)"><rect width="210" height="44" x="-105" y="-22" fill="#1e293b" fill-opacity=".75" stroke="#334155" stroke-width="1.2" rx="22"/><circle cx="-75" cy="0" r="6" fill="#38bdf8"/><text x="-55" y="5" fill="#e2e8f0" class="pill-text">DATA MARKETPLACES</text></g><g transform="translate(600, 290) translate(-120, 0)"><rect width="230" height="44" x="-115" y="-22" fill="#1e293b" fill-opacity=".75" stroke="#334155" stroke-width="1.2" rx="22"/><circle cx="-85" cy="0" r="6" fill="#818cf8"/><text x="-65" y="5" fill="#e2e8f0" class="pill-text">B2B ENRICHMENT APIS</text></g><g transform="translate(600, 290) translate(120, 0)"><rect width="210" height="44" x="-105" y="-22" fill="#1e293b" fill-opacity=".75" stroke="#334155" stroke-width="1.2" rx="22"/><circle cx="-75" cy="0" r="6" fill="#c084fc"/><text x="-55" y="5" fill="#e2e8f0" class="pill-text">IDENTITY &amp; KYB DATA</text></g><g transform="translate(600, 290) translate(350, 0)"><rect width="210" height="44" x="-105" y="-22" fill="#1e293b" fill-opacity=".75" stroke="#334155" stroke-width="1.2" rx="22"/><circle cx="-75" cy="0" r="6" fill="#34d399"/><text x="-55" y="5" fill="#e2e8f0" class="pill-text">OPEN DATA PORTALS</text></g></g><line x1="200" x2="1000" y1="418" y2="418" stroke="url(#primaryGrad)" stroke-linecap="round" stroke-width="2" opacity=".7"/></svg>